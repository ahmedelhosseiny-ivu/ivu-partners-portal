<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iVoiceUp | Partner Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --brand:#e10600; --brand-hover:#bd0700; --brand-press:#960700;
  --brand-subtle:#fff1f0; --brand-subtle-2:#ffdedb;
  --white:#fff;
  --n25:#fafbfb; --n50:#f5f6f7; --n100:#eceef0; --n200:#e5e8e8; --n300:#d2d6d8;
  --n400:#babdbf; --n500:#8a8f92; --n600:#63686b; --n700:#4a4e51; --n800:#404040;
  --n900:#1c1d1e; --n950:#0d0e0e;
  --text-strong:var(--n900); --text-body:var(--n800); --text-muted:var(--n600); --text-subtle:var(--n500);
  --border:var(--n200); --border-strong:var(--n300);
  --success:#1f9254; --success-bg:#e3f3ea; --success-700:#177544;
  --warning:#c77700; --warning-bg:#fbecd2; --warning-700:#9a5c00;
  --info:#2563c9;    --info-bg:#e2ecfb;    --info-700:#1c4d9e;
  --danger:#d92020;  --danger-bg:#fbe3e3;  --danger-700:#a81717;
  --ring:rgba(225,6,0,.35);
  --font:'Hanken Grotesk','Fakt Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-pill:999px;
  --shadow-sm:0 1px 3px rgba(28,29,30,.08),0 1px 2px rgba(28,29,30,.04);
  --shadow-lg:0 12px 28px rgba(28,29,30,.10),0 4px 10px rgba(28,29,30,.05);
  --shadow-brand:0 10px 26px rgba(225,6,0,.24);
  --ease:cubic-bezier(.2,.7,.3,1); --dur:200ms;
  --sidebar:256px; --header:72px;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);font-size:15px;line-height:1.5;color:var(--text-body);background:var(--n25);
  -webkit-font-smoothing:antialiased;display:flex;min-height:100vh}
h1,h2,h3,h4{margin:0;color:var(--text-strong);font-weight:600;letter-spacing:-.015em;line-height:1.15}
p{margin:0}
button{font:inherit}
:focus-visible{outline:0;box-shadow:0 0 0 3px var(--ring);border-radius:var(--r-sm)}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}

/* ---------- Sidebar ---------- */
.sidebar{width:var(--sidebar);flex:none;background:var(--white);border-right:1px solid var(--border);
  display:flex;flex-direction:column;justify-content:space-between;position:sticky;top:0;height:100vh}
.brand{display:flex;flex-direction:column;gap:10px;padding:24px 24px 20px;border-bottom:1px solid var(--border)}
.brand span{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-subtle)}
.nav{padding:16px 12px;display:grid;gap:2px}
.nav-btn{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border:0;border-radius:var(--r-md);
  background:none;color:var(--text-muted);font-size:14px;font-weight:500;text-align:left;cursor:pointer;
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
.nav-btn i{width:18px;text-align:center;color:var(--n500)}
.nav-btn:hover{background:var(--n50);color:var(--text-strong)}
.nav-btn.active{background:var(--n50);color:var(--text-strong);font-weight:600}
.nav-btn.active::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--brand)}
.nav-btn.active i{color:var(--brand)}
.profile{display:flex;align-items:center;gap:12px;padding:20px 24px;border-top:1px solid var(--border)}
.avatar{width:38px;height:38px;flex:none;border-radius:50%;background:var(--n900);color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700}
.profile b{display:block;font-size:14px;font-weight:600;color:var(--text-strong)}

/* ---------- Main Content ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:var(--header);position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:0 40px;background:rgba(255,255,255,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.content{width:100%;max-width:1200px;margin:0 auto;padding:40px}

/* Buttons & Forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 20px;border-radius:var(--r-pill);border:1px solid transparent;
  font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer;text-decoration:none;
  transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),color var(--dur) var(--ease)}
.btn-primary{background:var(--brand);color:#fff;box-shadow:var(--shadow-brand)}
.btn-primary:hover{background:var(--brand-hover)}
.panel{background:var(--white);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);padding:32px}
label{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--text-strong);margin-bottom:16px}
input,select{width:100%;height:44px;padding:0 14px;border:1px solid var(--border-strong);border-radius:var(--r-md);background:var(--white);
  font:inherit;font-size:14px;color:var(--text-strong)}
input:focus,select:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px var(--ring)}
</style>
</head>
<body>

<!-- ========== SIDEBAR ========== -->
<aside class="sidebar">
  <div>
    <div class="brand">
      <h3 style="color:var(--brand);">iVoiceUp</h3>
      <span>Partner Portal</span>
    </div>
    <div class="nav">
      <button class="nav-btn active"><i class="fa-solid fa-chart-pie"></i> <span>Dashboard</span></button>
      <button class="nav-btn"><i class="fa-solid fa-handshake"></i> <span>Deal Registration</span></button>
    </div>
  </div>
  <div class="profile">
    <div class="avatar">AE</div>
    <div>
      <b>Ahmed El Hosseiny</b>
      <span style="font-size:12px; color:var(--text-muted);">Channel Manager</span>
    </div>
  </div>
</aside>

<!-- ========== MAIN AREA ========== -->
<main class="main">
  <header class="topbar">
    <h2>Partner Deal Portal</h2>
    <span style="font-size:13px; color:var(--success-700); font-weight:600;"><i class="fa-solid fa-circle" style="font-size:8px;"></i> Live Environment</span>
  </header>

  <div class="content">
    <div class="panel">
      <h3>Register a New Deal</h3>
      <p style="color:var(--text-muted); margin-bottom:24px; font-size:14px;">Submit your registered client details to initiate automated conflict checks and HubSpot routing.</p>
      
      <form id="dealForm">
        <label>
          Company Name
          <input type="text" id="companyName" required placeholder="e.g. Al Hokair Group">
        </label>
        <label>
          Deal Amount ($)
          <input type="number" id="dealAmount" required placeholder="50000">
        </label>
        <label>
          Sector
          <select id="sector" required>
            <option value="">Select Sector</option>
            <option value="Technology">Technology</option>
            <option value="Real Estate">Real Estate</option>
            <option value="Banking & Finance">Banking & Finance</option>
            <option value="Telecommunications">Telecommunications</option>
          </select>
        </label>
        <button type="submit" class="btn btn-primary" style="margin-top:8px;">Submit Deal to CRM</button>
      </form>
    </div>
  </div>
</main>

<!-- ========== JAVASCRIPT WEBHOOK INTEGRATION ========== -->
<script>
document.getElementById('dealForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const formData = {
        company: document.getElementById('companyName').value,
        amount: document.getElementById('dealAmount').value,
        sector: document.getElementById('sector').value,
        submittedAt: new Date().toISOString()
    };

    // -------------------------------------------------------------------------
    // TODO: Replace the placeholder below with your active n8n Webhook Test URL
    // Example: https://your-vps-ip/webhook-test/xxxx-xxxx-xxxx
    // -------------------------------------------------------------------------
    const webhookUrl = 'YOUR_N8N_WEBHOOK_TEST_URL_HERE';

    try {
        const response = await fetch(webhookUrl, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(formData)
        });
        
        if (response.ok) {
            alert('Deal registered and sent to n8n successfully!');
            document.getElementById('dealForm').reset();
        } else {
            alert('Server error received. Please check your n8n workflow execution logs.');
        }
    } catch (error) {
        console.error('Network error:', error);
        alert('Failed to connect to n8n webhook. Make sure your webhook URL is correctly pasted.');
    }
});
</script>

</body>
</html>
